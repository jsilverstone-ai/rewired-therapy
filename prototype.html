<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rewired Therapy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F3EEE4;
      --paper-2: #E8E1D4;
      --ink: #1C1915;
      --quiet: #5C564C;
      --hairline: #D4CBBA;
      --bell: #8F4B2A;
      --good: #3F5A45;
      --sans: "IBM Plex Sans", "Helvetica Neue", sans-serif;
      --serif: "Newsreader", "Iowan Old Style", "Palatino", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.45;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .status {
      padding: 16px 24px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--quiet);
    }
    .screen { display: none; flex-direction: column; flex: 1; padding: 16px 24px 24px; }
    .screen.on { display: flex; }
    .keeper {
      width: 64px; height: 64px; border-radius: 50%;
      border: 1px solid var(--ink); margin: 32px auto 0; position: relative;
    }
    .keeper::after {
      content: ""; position: absolute; inset: 12px; border-radius: 50%;
      background: var(--bell); opacity: 0.9;
    }
    .rite {
      font-family: var(--serif); font-size: 36px; line-height: 1.08;
      font-weight: 400; letter-spacing: -0.02em; text-align: center; margin-top: 24px;
    }
    .lede { text-align: center; color: var(--quiet); margin-top: 12px; }
    .rule { height: 1px; background: var(--hairline); margin: 32px 0 20px; }
    .meta { display: flex; justify-content: space-between; color: var(--quiet); font-size: 14px; }
    .act { margin-top: 20px; font-family: var(--serif); font-size: 20px; line-height: 1.35; }
    .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 32px; }
    button {
      font-family: var(--sans); font-size: 16px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--paper); border-radius: 4px;
      padding: 14px 16px; min-height: 48px; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--ink); }
    button.quiet { background: transparent; border-color: transparent; color: var(--quiet); min-height: 44px; }
    .tabs {
      display: flex; justify-content: space-around;
      border-top: 1px solid var(--hairline); padding: 8px 8px 20px;
    }
    .tabs button {
      border: 0; background: none; color: var(--quiet); font-size: 12px;
      font-weight: 500; letter-spacing: 0.04em; min-height: 44px; padding: 8px 12px;
    }
    .tabs button.now { color: var(--ink); }
    h2 { font-family: var(--serif); font-size: 28px; font-weight: 400; margin: 16px 0 8px; }
    .row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hairline); cursor: pointer;
    }
    .row .when { font-variant-numeric: tabular-nums; color: var(--quiet); font-size: 14px; min-width: 48px; }
    .row .name { font-family: var(--serif); font-size: 20px; flex: 1; }
    .row .kind { font-size: 12px; color: var(--quiet); }
    .ask { font-family: var(--serif); font-size: 28px; line-height: 1.2; margin: 24px 0 8px; }
    .quote { background: var(--paper-2); padding: 16px; border-radius: 2px; color: var(--quiet); margin-top: 16px; }
    textarea {
      width: 100%; min-height: 96px; border: 1px solid var(--hairline);
      background: var(--paper); border-radius: 4px; padding: 12px;
      font-family: var(--serif); font-size: 18px; color: var(--ink); resize: none; outline: none;
    }
    textarea:focus { border-color: var(--ink); }
    .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
    .close-item {
      display: flex; justify-content: space-between; padding: 14px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .close-item span { color: var(--quiet); font-size: 14px; }
    .kept { color: var(--good); }
  </style>
</head>
<body>
  <div class="app">
    <div class="status">Rewired Therapy</div>
    <section class="screen on" id="hour">
      <div class="keeper" aria-hidden="true"></div>
      <div class="rite" id="hour-rite">Nothing planted</div>
      <p class="lede" id="hour-lede">Name one thing that needs an hour.</p>
      <div class="rule"></div>
      <div class="meta">
        <span id="hour-duration">—</span>
        <span id="hour-when">—</span>
      </div>
      <p class="act" id="hour-act">The ribbon is empty.</p>
      <div class="actions">
        <button type="button" id="btn-keep" onclick="keepForm()">Keep the form</button>
        <button type="button" class="ghost" onclick="show('seed')">Capture a seed</button>
        <button type="button" class="quiet" onclick="removeForm()" id="btn-remove">Remove this form</button>
      </div>
    </section>
    <section class="screen" id="ribbon">
      <h2>Today’s ribbon</h2>
      <div id="ribbon-list"></div>
      <p class="lede" id="ribbon-note" style="text-align:left; margin-top:24px;"></p>
      <div class="actions">
        <button type="button" class="ghost" onclick="show('seed')">Capture a seed</button>
      </div>
    </section>
    <section class="screen" id="seed">
      <h2>What needs an hour?</h2>
      <textarea id="seed-text" placeholder="a bill, a class, the sink"></textarea>
      <p class="quote">Once, or does it return? That is the only question.</p>
      <div class="actions">
        <button type="button" onclick="holdSeed()">Hold this</button>
        <button type="button" class="quiet" onclick="show('ribbon')">Cancel</button>
      </div>
    </section>
    <section class="screen" id="ask">
      <p class="quote" id="ask-quote"></p>
      <p class="ask">Once, or does it return?</p>
      <div class="choices">
        <button type="button" class="ghost" onclick="show('ask2')">It returns</button>
        <button type="button" class="ghost" onclick="plant('once')">Once</button>
        <button type="button" class="quiet" onclick="show('ribbon')">Decide later</button>
      </div>
    </section>
    <section class="screen" id="ask2">
      <p class="ask">How does it return?</p>
      <div class="choices">
        <button type="button" class="ghost" onclick="plant('monthly')">Same date each month</button>
        <button type="button" class="ghost" onclick="plant('weekly')">Same weekday</button>
        <button type="button" class="ghost" onclick="plant('after-last')">After the last time</button>
      </div>
    </section>
    <section class="screen" id="planted">
      <div class="keeper" aria-hidden="true"></div>
      <div class="rite" id="planted-rite"></div>
      <p class="lede" id="planted-lede"></p>
      <div class="actions">
        <button type="button" onclick="show('hour')">It is the hour</button>
        <button type="button" class="ghost" onclick="show('ribbon')">See the ribbon</button>
      </div>
    </section>
    <section class="screen" id="close">
      <h2>What was kept</h2>
      <div id="close-list"></div>
      <p class="lede" style="text-align:left; margin-top:28px;">Tomorrow the hour is clean again.</p>
      <div class="actions">
        <button type="button" onclick="show('hour')">Good night</button>
      </div>
    </section>
    <nav class="tabs">
      <button class="now" type="button" onclick="show('hour')">Hour</button>
      <button type="button" onclick="show('ribbon')">Ribbon</button>
      <button type="button" onclick="show('seed')">Seed</button>
      <button type="button" onclick="show('close')">Close</button>
    </nav>
  </div>
  <script>
    const KEY = "rewired-therapy-forms-v1";
    const CURRENT_KEY = "rewired-therapy-current-v1";
    const STARTER = [
      { name: "Sink-form", kind: "daily", when: "19:10", duration: "Ten minutes", action: "Clear the basin only.", kept: false }
    ];
    let draft = "";
    let forms = load();
    let current = Number(localStorage.getItem(CURRENT_KEY) || 0);
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return STARTER.slice();
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : STARTER.slice();
      } catch (e) { return STARTER.slice(); }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(forms)); }
    function formTitle(text, kind) {
      const clean = text.trim().replace(/\s+/g, " ");
      if (kind === "once") return clean;
      if (/form$/i.test(clean)) return clean;
      return clean + "-form";
    }
    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
      document.getElementById(id).classList.add("on");
      const map = { hour: "Hour", ribbon: "Ribbon", seed: "Seed", ask: "Seed", ask2: "Seed", planted: "Ribbon", close: "Close" };
      document.querySelectorAll(".tabs button").forEach((t) => {
        t.classList.toggle("now", t.textContent === map[id]);
      });
      if (id === "ribbon") drawRibbon();
      if (id === "hour") drawHour();
      if (id === "close") drawClose();
    }
    function holdSeed() {
      draft = document.getElementById("seed-text").value.trim();
      if (!draft) return;
      document.getElementById("ask-quote").textContent = "“" + draft + "”";
      show("ask");
    }
    function plant(kind) {
      const name = formTitle(draft || "untitled", kind);
      forms.push({ name, kind, when: kind === "once" ? "Once" : "Next", duration: "Eight minutes", action: "Open it. Do the first physical action. Stop.", kept: false });
      current = forms.length - 1;
      localStorage.setItem(CURRENT_KEY, String(current));
      save();
      document.getElementById("planted-rite").textContent = name;
      document.getElementById("planted-lede").textContent = kind === "once" ? "It will not come back unless you plant it again." : "Planted as a " + kind + " form.";
      document.getElementById("seed-text").value = "";
      draft = "";
      drawHour(); drawRibbon(); show("planted");
    }
    function keepForm() {
      if (!forms.length) return show("seed");
      (forms[current] || forms[0]).kept = true;
      save(); drawClose(); show("close");
    }
    function removeForm() {
      if (!forms.length) return;
      forms.splice(current, 1);
      if (current >= forms.length) current = Math.max(0, forms.length - 1);
      localStorage.setItem(CURRENT_KEY, String(current));
      save(); drawHour(); drawRibbon(); drawClose();
      show(forms.length ? "hour" : "seed");
    }
    function currentForm() {
      if (!forms.length) return null;
      if (current < 0 || current >= forms.length) current = 0;
      return forms[current];
    }
    function choose(index) {
      current = index;
      localStorage.setItem(CURRENT_KEY, String(current));
      drawHour(); show("hour");
    }
    function drawHour() {
      const f = currentForm();
      const remove = document.getElementById("btn-remove");
      const keep = document.getElementById("btn-keep");
      if (!f) {
        document.getElementById("hour-rite").textContent = "Nothing planted";
        document.getElementById("hour-lede").textContent = "Name one thing that needs an hour.";
        document.getElementById("hour-duration").textContent = "—";
        document.getElementById("hour-when").textContent = "—";
        document.getElementById("hour-act").textContent = "The ribbon is empty.";
        remove.style.display = "none"; keep.style.display = "none";
        return;
      }
      remove.style.display = ""; keep.style.display = "";
      document.getElementById("hour-rite").textContent = f.name;
      document.getElementById("hour-lede").textContent = "You do not need to feel ready.";
      document.getElementById("hour-duration").textContent = f.duration;
      document.getElementById("hour-when").textContent = f.when;
      document.getElementById("hour-act").textContent = f.action;
    }
    function drawRibbon() {
      const list = document.getElementById("ribbon-list");
      list.innerHTML = "";
      forms.forEach((f, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="when"></span><span class="name"></span><span class="kind"></span>';
        row.querySelector(".when").textContent = f.when;
        row.querySelector(".name").textContent = f.name;
        row.querySelector(".kind").textContent = f.kind;
        row.addEventListener("click", () => choose(i));
        list.appendChild(row);
      });
      const n = forms.length;
      document.getElementById("ribbon-note").textContent = n === 0 ? "No appointed hours yet." : n === 1 ? "One appointed hour." : n + " appointed hours.";
    }
    function drawClose() {
      const list = document.getElementById("close-list");
      list.innerHTML = "";
      forms.forEach((f) => {
        const row = document.createElement("div");
        row.className = "close-item";
        const mark = document.createElement("span");
        mark.textContent = f.kept ? "kept" : "not yet";
        if (f.kept) mark.className = "kept";
        row.appendChild(document.createTextNode(f.name + " "));
        row.appendChild(mark);
        list.appendChild(row);
      });
    }
    drawHour(); drawRibbon(); drawClose();
  </script>
</body>
</html>
